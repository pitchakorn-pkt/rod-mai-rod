# Render Blueprint: รอดไม่รอดทั้งระบบเป็น web service เดียว + Postgres
# วิธีใช้และค่าที่ต้องใส่เอง: deploy/render/README.md
services:
  - type: web
    name: rod-mai-rod
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    plan: standard  # 2 GB: บริการ 6 ตัว + ข้อมูลน้ำท่วม GISTDA ใช้แรมราว 600 MB ตัวฟรี/starter 512 MB ไม่พอ
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: rod-mai-rod-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DEMO_MODE
        value: "false"
      - key: ROUTING_PROVIDER
        value: osrm
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: LLM_PRIMARY
        value: groq
      - key: LLM_FALLBACK
        value: gemini,groq2
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ2_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ2_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      # ใส่ค่าเองในหน้า Environment ของ Render (sync: false = ไม่อยู่ในไฟล์นี้)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ2_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GISTDA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: rod-mai-rod-db
    plan: free
    region: singapore
    databaseName: rodmairod
    user: rodmairod
